<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1916 Boston Directory Search</title>
<style>
  body {
    max-width: 960px;
    margin: 40px auto;
    padding: 0 20px;
    font-family: Arial, sans-serif;
    color: #283d32;
    background: #f5f3eb;
  }
  input, select, button {
    padding: 10px;
    margin: 4px 4px 4px 0;
    font: inherit;
  }
  input { width: min(90%, 420px); }
  article {
    margin: 16px 0;
    padding: 20px;
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
  }
  h2 { margin: 10px 0; }
  dt { margin-top: 12px; font-weight: bold; }
  dd { margin: 4px 0; overflow-wrap: anywhere; }
  small, .note { color: #666; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; }
  summary, button { cursor: pointer; }
  nav { margin: 24px 0; }
</style>
</head>
<body>
<h1>1916 Boston Directory Search</h1>
<p>Search names, occupations, work addresses and home addresses.</p>

<input id="query" type="search" aria-label="Search"
       placeholder="Try Aaron, lawyer or Court">

<select id="model" aria-label="OCR model">
  <option value="">Both models</option>
  <option>Tesseract</option>
  <option>DOTS.MOCR</option>
</select>

<select id="page" aria-label="Source page">
  <option value="">All pages</option>
  <option>161</option><option>162</option><option>163</option>
  <option>164</option><option>165</option><option>166</option>
  <option>167</option>
</select>

<p class="note">
  Records from the two models are shown separately.
  Counts are not unique people. All records require review.
</p>

<p id="count" role="status">Loading data…</p>
<div id="results"></div>

<nav aria-label="Result pages">
  <button id="previous" disabled>Previous</button>
  <span id="position"></span>
  <button id="next" disabled>Next</button>
</nav>

<script>
const $ = id => document.getElementById(id);
let records = [], matches = [], offset = 0;
const pageSize = 20;

function element(tag, text) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  return node;
}

function search() {
  const words = $("query").value.trim().toLowerCase()
    .split(/\s+/).filter(Boolean);

  matches = records.filter(record => {
    if ($("model").value &&
        record.ocr_model !== $("model").value) return false;
    if ($("page").value &&
        record.source_page !== $("page").value) return false;

    const text = [
      record.name, record.name_as_printed,
      record.occupation, record.work_address, record.home_address
    ].filter(Boolean).join(" ").toLowerCase();

    return words.every(word => text.includes(word));
  });

  offset = 0;
  render();
}

function render() {
  $("results").replaceChildren();
  $("count").textContent =
    `${matches.length} matching records (not unique people)`;

  for (const record of matches.slice(offset, offset + pageSize)) {
    const card = element("article");
    card.append(
      element("small",
        `Page ${record.source_page} · ${record.ocr_model}`),
      element("h2",
        record.name || record.name_as_printed || "Name uncertain")
    );

    if (!record.name) {
      card.append(element("p",
        "Full name is uncertain; the OCR name fragment is shown."));
    }

    const fields = element("dl");
    for (const [label, value] of [
      ["Occupation", record.occupation],
      ["Work address · requires review", record.work_address],
      ["Home address", record.home_address]
    ]) {
      fields.append(
        element("dt", label),
        element("dd", value || "Missing or uncertain")
      );
    }
    card.append(fields);

    const details = element("details");
    details.append(
      element("summary", "Original OCR and review flags"),
      element("pre", record.original_ocr_text || ""),
      element("p", "Review flags: " + (record.flags || []).join("; "))
    );
    card.append(details);

    try {
      const url = new URL(record.source_url);
      if (url.protocol === "https:" && url.hostname === "archive.org") {
        const link = element("a", "View original scan ↗");
        link.href = url.href;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        card.append(link);
      }
    } catch {}

    $("results").append(card);
  }

  if (!matches.length) {
    $("results").append(element("p",
      "No matches. Try a shorter keyword or change the filters."));
  }

  $("previous").disabled = offset === 0;
  $("next").disabled = offset + pageSize >= matches.length;
  $("position").textContent = matches.length
    ? `${offset / pageSize + 1} / ${Math.ceil(matches.length / pageSize)}`
    : "0 / 0";
}

$("query").addEventListener("input", search);
$("model").addEventListener("change", search);
$("page").addEventListener("change", search);

$("previous").onclick = () => {
  offset = Math.max(0, offset - pageSize);
  render();
};

$("next").onclick = () => {
  offset += pageSize;
  render();
};

fetch("./people.json")
  .then(response => {
    if (!response.ok) throw new Error("Data unavailable");
    return response.json();
  })
  .then(data => {
    if (!Array.isArray(data)) throw new Error("Invalid data");
    records = data;
    search();
  })
  .catch(() => {
    $("count").textContent =
      "Could not load people.json. Open through a web server or GitHub Pages.";
  });
</script>
</body>
</html>
