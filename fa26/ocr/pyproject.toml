[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "bpl-directory-ocr"
version = "0.1.0"
description = "Traceable full-page Tesseract OCR for the 1916 Boston Directory"
requires-python = ">=3.11"
dependencies = ["Pillow==11.3.0", "psutil==7.0.0"]

[project.scripts]
bpl-ocr = "bpl_ocr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
